name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > debug.keystore; else keytool -genkey -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug"; fi
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: adr-pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Restore Morphe signing keystore
        env:
          KS: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS" || { echo "MORPHE_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/morphe.p12"
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/morphe.p12
          STORE_PASSWORD: ${{ secrets.MORPHE_KEY_PASSWORD }}
          KEY_ALIAS: morphe
          KEY_PASSWORD: ${{ secrets.MORPHE_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Verify Morphe signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signer-certs.txt
          grep -qi '0a8b609561f299eaba4518c57e558d506e3991bd0ac551cc167716241adad55f' signer-certs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
