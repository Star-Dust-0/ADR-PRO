name: Original app screenshots (temporary)
on: workflow_dispatch
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash -c 'echo KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\" > /etc/udev/rules.d/99-kvm4all.rules; udevadm control --reload-rules; udevadm trigger --name-match=kvm'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb push tools/testcsv/. /sdcard/Download/
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Download/T1.csv
            adb install -r recovery/original/ADR_PRO_base.apk
            adb shell am start -n com.ELE.ADR.Merger/com.example.MainActivity
            sleep 7
            python3 tools/shoot.py shots-en x
            true
            adb shell cmd locale set-app-locales com.ELE.ADR.Merger --locales ar
            adb shell am force-stop com.ELE.ADR.Merger
            adb shell am start -n com.ELE.ADR.Merger/com.example.MainActivity
            sleep 7
            adb exec-out screencap -p > shots-en/20-arabic-home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: original-shots, path: shots-en }
