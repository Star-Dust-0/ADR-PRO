name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > debug.keystore
      - name: Build APK
        run: gradle assembleDebug
      - name: Name the asset
        run: cp app/build/outputs/apk/debug/app-debug.apk "ADR-PRO-${GITHUB_REF_NAME}.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ADR-PRO-${GITHUB_REF_NAME}.apk" --title "ADR PRO ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
