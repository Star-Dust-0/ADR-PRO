name: Compare with original (temporary)
on: workflow_dispatch
jobs:
  cmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
      - run: gradle assembleDebug
      - run: sudo bash -c 'echo KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\" > /etc/udev/rules.d/99-kvm4all.rules; udevadm control --reload-rules; udevadm trigger --name-match=kvm'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb push tools/testcsv/. /sdcard/Download/
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Download/T1.csv
            adb install -r recovery/original/ADR_PRO_base.apk
            adb shell am start -n com.ELE.ADR.Merger/com.example.MainActivity
            sleep 7
            python3 tools/shoot.py out/orig x || true
            adb uninstall com.ELE.ADR.Merger
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.ELE.ADR.Merger/com.example.MainActivity
            sleep 7
            python3 tools/shoot.py out/mine x || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: compare, path: out }
